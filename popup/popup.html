<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 8 6 6"></path>
            <path d="m4 14 6-6 2-3"></path>
            <path d="M2 5h12"></path>
            <path d="M7 2h1"></path>
            <path d="m22 22-5-10-5 10"></path>
            <path d="M14 18h6"></path>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Dragit</h1>
          <span class="version-tag">v1.3</span>
        </div>
      </div>
      <label class="switch" title="Dragit 켜기 / 끄기">
        <input type="checkbox" id="main-translate-toggle" aria-label="Dragit 켜기 / 끄기" role="switch">
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-translate">번역 설정</button>
      <button class="nav-tab" data-tab="tab-domain">컨텍스트 (<span id="domain-count-badge">6</span>)</button>
      <button class="nav-tab" data-tab="tab-ai">API 설정</button>
    </nav>

    <!-- Tab 1: Translation Settings -->
    <main class="tab-content active" id="tab-translate">
      <!-- Language Selection -->
      <div class="card">
        <label class="card-title">언어 설정</label>
        <div class="lang-selector-group">
          <div class="lang-box readonly">
            <span class="lang-tag">원문</span>
            <span class="lang-val">자동 감지</span>
          </div>
          <div class="lang-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </div>
          <div class="lang-box">
            <span class="lang-tag">번역</span>
            <select id="select-target-lang" class="custom-select">
              <option value="ko" selected>한국어 (Korean)</option>
              <option value="en">영어 (English)</option>
              <option value="ja">일본어 (日本語)</option>
              <option value="zh-CN">중국어 간체 (简体中文)</option>
              <option value="zh-TW">중국어 번체 (繁體中文)</option>
              <option value="es">스페인어 (Español)</option>
              <option value="fr">프랑스어 (Français)</option>
              <option value="de">독일어 (Deutsch)</option>
              <option value="ru">러시아어 (Русский)</option>
              <option value="vi">베트남어 (Tiếng Việt)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Domain Preset Quick Selection -->
      <div class="card">
        <div class="card-header-row">
          <label class="card-title">컨텍스트 설정</label>
        </div>
        <p class="card-hint">번역에 참고할 문맥을 선택하세요.</p>

        <div class="domain-quick-select-wrap">
          <select id="select-active-domain" class="custom-select">
            <option value="">없음</option>
            <!-- Populated via JS -->
          </select>
        </div>

      </div>

      <section class="card" aria-labelledby="addon-title">
        <div class="card-header-row">
          <h2 class="card-title" id="addon-title">Add-on</h2>
          <label class="addon-option"><input type="checkbox" id="pdf-viewer-toggle"> PDF viewer</label>
        </div>
        <div id="pdf-viewer-options" hidden>
          <p class="card-hint">PDF에서 선택한 글을 side 패널로 번역합니다.</p>
          <button type="button" class="btn-secondary-sm" id="btn-open-pdf">Open PDF ↗</button>
        </div>
      </section>
    </main>

    <!-- Tab 2: Domain Management (Add/Edit/Delete) -->
    <section class="tab-content" id="tab-domain">
      <div class="domain-header-actions">
        <span class="sub-heading">Saved</span>
        <button type="button" class="btn-primary-sm" id="btn-open-add-domain">+ Add</button>
      </div>

      <div class="domain-list" id="domain-list-container">
        <!-- Rendered by JS -->
      </div>

      <!-- Domain Add/Edit Modal/Drawer -->
      <div class="modal-overlay" id="domain-modal" style="display: none;">
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 id="modal-title">Add context</h3>
            <button type="button" class="btn-close-modal" id="btn-close-domain-modal">&times;</button>
          </div>
          <form id="domain-form" class="modal-body">
            <input type="hidden" id="domain-form-id">
            <div class="form-group">
              <label for="domain-form-name">Alias <span class="required">*</span></label>
              <input type="text" id="domain-form-name" placeholder="예: 개발 문서, 게임, 논문" required maxlength="30">
            </div>
            <div class="form-group">
              <label for="domain-form-desc">설명 (선택)</label>
              <input type="text" id="domain-form-desc" placeholder="예: 게임 스킬명 및 아이템명 용어 준수" maxlength="60">
            </div>
            <div class="form-group">
              <label for="domain-form-prompt">Context <span class="required">*</span></label>
              <textarea id="domain-form-prompt" rows="4" placeholder="번역에 참고할 배경이나 용어를 적어주세요." required></textarea>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn-secondary" id="btn-cancel-domain-modal">취소</button>
              <button type="submit" class="btn-primary" id="btn-save-domain">저장하기</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Tab 3: AI Engine Settings (Gemini API) -->
    <section class="tab-content" id="tab-ai">
      <!-- Gemini Settings -->
      <div class="card" id="section-gemini-settings">
        <div class="card-header-row">
          <label class="card-title">Gemini API key</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-link">키 발급 ↗</a>
        </div>
        <div class="api-key-input-wrap">
          <input type="password" id="input-gemini-key" placeholder="AIzaSy..." spellcheck="false">
          <button type="button" class="btn-icon" id="btn-toggle-key-visibility" title="API 키 표시" aria-label="API 키 표시" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>
              <path id="key-eye-slash" d="m3 3 18 18" hidden></path>
            </svg>
          </button>
        </div>
        <div class="form-row-between mt-2">
          <div class="form-group-inline">
            <label for="select-gemini-model">모델:</label>
            <input type="text" id="select-gemini-model" class="custom-select-sm" list="gemini-model-list" value="gemini-3.5-flash-lite" spellcheck="false" style="width: 170px;">
            <datalist id="gemini-model-list">
              <option value="gemini-3.5-flash-lite">
              <option value="gemini-3.1-flash-lite">
              <option value="gemini-2.5-flash-lite">
            </datalist>
          </div>
          <button type="button" class="btn-secondary-sm" id="btn-test-gemini-key">연결 테스트</button>
        </div>
        <div class="test-result-msg" id="gemini-test-result"></div>
      </div>
    </section>

    <!-- Footer Toast Notification -->
    <div class="toast" id="toast-message"></div>
  </div>

  <script src="../shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
